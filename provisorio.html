<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Página no disponible — Diego & Cami</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --verde-osc: #234122;
  --verde-claro: #6b8b6b;
  --beige: #e7dfc7;
  --accent: #bfb58e;
  --bg: #f6f4ec;
}
.parallax-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  background: url('fondo.jpg') center center / cover no-repeat scroll;
  will-change: background-position;
  pointer-events: none;
}
body {
  min-height: 100vh;
  background: transparent;
  position: relative;
  overflow-x: hidden;
}
.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
}
img {
  max-width: 400px;
  width: 100%;
  border-radius: 6px;
  margin-bottom: 32px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12);
}
h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 3.2rem;
  margin-bottom: 18px;
}
.sub {
  font-weight: lighter;
  font-size: 1.5rem;
  background: rgba(255,255,255,0.7);
  padding: 8px 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  text-shadow: 0 2px 8px rgba(0,0,0,0.22);
  color: #234122;
  margin-bottom: 24px;
}
.msg-box {
  background: rgba(255,255,255,0.85);
  padding: 28px 32px;
  border-radius: 18px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.10);
  text-align: center;
  max-width: 420px;
}
</style>
</head>
<body>
<div class="parallax-bg"></div>
<div class="wrap">
  <img src="PortadaGaleria.jpg" alt="Diego y Cami">
  <h1>Diego & Cami</h1>
  <div class="sub">Nuestra noche perfecta, capturada por ustedes</div>
  <div class="msg-box">
    <h2 style="font-family:'Montserrat',sans-serif;font-size:1.6rem;color:var(--verde-osc);margin-bottom:12px;">Página no disponible</h2>
    <p style="font-size:1.15rem;color:var(--verde-claro);margin-bottom:8px;">La galería aún no está habilitada.<br>¡Vuelve pronto para compartir y ver las fotos del evento!</p>
    <p style="font-size:1rem;color:var(--verde-osc);margin-top:18px;">Gracias por tu interés y paciencia.</p>
  </div>
</div>
</body>
</html>
